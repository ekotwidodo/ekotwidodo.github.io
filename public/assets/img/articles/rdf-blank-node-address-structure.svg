<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Light Canvas Background -->
    <linearGradient id="bgLight3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="cardOrgLight3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>

    <linearGradient id="cardBlankNodeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>

    <linearGradient id="cardLitLight3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowAmber3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowGreen3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect x="0" y="0" width="860" height="520" rx="16" fill="url(#bgLight3)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g>
    <text x="430" y="36" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Representing Anonymous Structured Data with Blank Nodes</text>
    <text x="430" y="56" text-anchor="middle" fill="#64748b" font-size="12">Grouping postal address properties without minting a global public IRI</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. PARENT RESOURCE NODE: ex:publisher1 -->
  <!-- ========================================================================= -->
  <g transform="translate(280, 78)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="300" height="76" rx="12" fill="url(#cardOrgLight3)" stroke="#7c3aed" stroke-width="1.8" />
    <!-- Badge -->
    <rect x="14" y="12" width="135" height="18" rx="5" fill="#f3e8ff" stroke="#c084fc" stroke-width="1" />
    <text x="81" y="25" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="600" font-family="ui-monospace, monospace">schema:Organization</text>
    <!-- Label -->
    <text x="14" y="52" fill="#0f172a" font-size="15" font-weight="700">Example Press</text>
    <text x="175" y="52" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">ex:publisher1</text>
  </g>

  <!-- CONNECTOR 1: Publisher -> Blank Node -->
  <line x1="430" y1="154" x2="430" y2="218" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAmber3)" />
  <!-- Predicate Pill 1 (schema:address) -->
  <g transform="translate(355, 172)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="150" height="24" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
    <text x="75" y="16.5" text-anchor="middle" fill="#b45309" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">schema:address</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. BLANK NODE: Anonymous Postal Address -->
  <!-- ========================================================================= -->
  <g transform="translate(250, 222)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="360" height="86" rx="12" fill="url(#cardBlankNodeLight)" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3" />
    <!-- Badge -->
    <rect x="14" y="12" width="145" height="20" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" />
    <text x="86" y="26" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700" font-family="ui-monospace, monospace">schema:PostalAddress</text>
    <!-- Title & Subtitle -->
    <text x="14" y="54" fill="#0f172a" font-size="14" font-weight="700">Blank Node [ ... ]</text>
    <text x="14" y="72" fill="#92400e" font-size="11">Anonymous local resource (no explicit IRI)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. CONNECTORS & TARGET LITERALS -->
  <!-- ========================================================================= -->

  <!-- CONNECTOR 2A: Blank Node -> City (Left branch) -->
  <path d="M 340 308 C 340 340, 230 345, 230 376" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen3)" />
  <!-- Predicate Pill 2A (schema:addressLocality) -->
  <g transform="translate(145, 326)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="170" height="24" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
    <text x="85" y="16.5" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600" font-family="ui-monospace, monospace">schema:addressLocality</text>
  </g>

  <!-- LITERAL 1: City Card -->
  <g transform="translate(70, 380)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="320" height="56" rx="10" fill="url(#cardLitLight3)" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 2" />
    <text x="16" y="22" fill="#15803d" font-size="9.5" font-weight="600">LITERAL (xsd:string)</text>
    <text x="16" y="42" fill="#0f172a" font-size="14" font-weight="700" font-family="ui-monospace, monospace">"Bandar Lampung"</text>
  </g>

  <!-- CONNECTOR 2B: Blank Node -> Country (Right branch) -->
  <path d="M 520 308 C 520 340, 630 345, 630 376" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen3)" />
  <!-- Predicate Pill 2B (schema:addressCountry) -->
  <g transform="translate(545, 326)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="170" height="24" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
    <text x="85" y="16.5" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600" font-family="ui-monospace, monospace">schema:addressCountry</text>
  </g>

  <!-- LITERAL 2: Country Card -->
  <g transform="translate(470, 380)" filter="url(#softShadow3)">
    <rect x="0" y="0" width="320" height="56" rx="10" fill="url(#cardLitLight3)" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 2" />
    <text x="16" y="22" fill="#15803d" font-size="9.5" font-weight="600">LITERAL (xsd:string)</text>
    <text x="16" y="42" fill="#0f172a" font-size="14" font-weight="700" font-family="ui-monospace, monospace">"ID"</text>
  </g>

  <!-- ========================================================================= -->
  <!-- Bottom Note Footer -->
  <!-- ========================================================================= -->
  <g transform="translate(120, 460)">
    <rect x="0" y="0" width="620" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="310" y="23" text-anchor="middle" fill="#475569" font-size="11.5">
      Turtle syntax: <tspan font-family="ui-monospace, monospace" font-weight="600" fill="#b45309">schema:address [ a schema:PostalAddress ; schema:addressLocality "..." ; ... ]</tspan>
    </text>
  </g>
</svg>
