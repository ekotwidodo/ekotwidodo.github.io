<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Light Canvas Background Gradient -->
    <linearGradient id="bgCanvasLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Node Card Gradients (Light) -->
    <linearGradient id="subjectCardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="objectCardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowTealLight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect x="0" y="0" width="820" height="400" rx="16" fill="url(#bgCanvasLight)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Diagram Header -->
  <g>
    <text x="410" y="38" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700" letter-spacing="-0.01em">RDF Semantic Triple Representation</text>
    <text x="410" y="58" text-anchor="middle" fill="#64748b" font-size="12" font-weight="400">Explicit directed relationship linking two identified resources</text>
  </g>

  <!-- Left Dimension Indicators (Subject / Predicate / Object) -->
  <g font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.05em">
    <text x="175" y="126" fill="#0284c7">SUBJECT</text>
    <text x="175" y="142" fill="#94a3b8" font-size="10" font-weight="400">Resource Entity</text>

    <text x="175" y="215" fill="#6366f1">PREDICATE</text>
    <text x="175" y="231" fill="#94a3b8" font-size="10" font-weight="400">Named Relationship</text>

    <text x="175" y="306" fill="#0d9488">OBJECT</text>
    <text x="175" y="322" fill="#94a3b8" font-size="10" font-weight="400">Target Resource</text>
  </g>

  <!-- Vertical Guide Line -->
  <line x1="195" y1="90" x2="195" y2="350" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 1. SUBJECT NODE -->
  <g transform="translate(230, 85)" filter="url(#softShadow)">
    <rect x="0" y="0" width="460" height="74" rx="12" fill="url(#subjectCardLight)" stroke="#0284c7" stroke-width="1.5" />
    <!-- Type Pill -->
    <rect x="18" y="14" width="94" height="20" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="28" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">schema:Book</text>
    <!-- Identifier / IRI -->
    <text x="122" y="28" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">IRI: &lt;https://example.org/book1&gt;</text>
    <!-- Resource Title -->
    <text x="18" y="54" fill="#0f172a" font-size="15" font-weight="700">Introduction to Knowledge Graphs</text>
  </g>

  <!-- CONNECTOR LINE WITH ARROW -->
  <line x1="460" y1="160" x2="460" y2="265" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTealLight)" />

  <!-- PREDICATE BADGE (Center) -->
  <g transform="translate(365, 196)" filter="url(#softShadow)">
    <rect x="0" y="0" width="190" height="36" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="18" cy="18" r="4" fill="#6366f1" />
    <text x="100" y="23" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="600" font-family="ui-monospace, monospace">schema:author</text>
  </g>

  <!-- 2. OBJECT NODE -->
  <g transform="translate(230, 265)" filter="url(#softShadow)">
    <rect x="0" y="0" width="460" height="74" rx="12" fill="url(#objectCardLight)" stroke="#0d9488" stroke-width="1.5" />
    <!-- Type Pill -->
    <rect x="18" y="14" width="102" height="20" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1" />
    <text x="69" y="28" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">schema:Person</text>
    <!-- Identifier / IRI -->
    <text x="130" y="28" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">IRI: &lt;https://example.org/janeDoe&gt;</text>
    <!-- Resource Name -->
    <text x="18" y="54" fill="#0f172a" font-size="15" font-weight="700">Jane Doe</text>
  </g>
</svg>
