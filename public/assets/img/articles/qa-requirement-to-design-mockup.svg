<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="16" fill="#f8fafc"/>

  <!-- Top Title -->
  <g transform="translate(40, 28)">
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Verifikasi Requirement: Dari Dokumen Teks Menjadi Desain Nyata</text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Menjembatani pemahaman tim pengembang dan QA agar tidak terjadi multitafsir saat pengujian</text>
  </g>

  <!-- ==================== PANEL KIRI: TEKS SPESIFIKASI REQUIREMENT ==================== -->
  <g transform="translate(40, 90)">
    <rect width="420" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Title Card -->
    <rect x="20" y="16" width="380" height="30" rx="6" fill="#fef2f2"/>
    <text x="210" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Dokumen Requirement Teks (Raw Specification)</text>

    <!-- Document Content Area -->
    <rect x="20" y="60" width="380" height="235" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <g transform="translate(36, 80)">
      <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">Feature: Product Search Field</text>
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">"In Search box field, user can search books, audio</text>
      <text x="0" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">books, electronics, etc. After entering any search text</text>
      <text x="0" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">term/keyword into Search box and clicking Search,</text>
      <text x="0" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">the respective search results should be displayed.</text>
      
      <line x1="0" y1="108" x2="348" y2="108" stroke="#cbd5e1" stroke-dasharray="3 3"/>

      <text x="0" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Kondisi Khusus (Edge Case):</text>
      <text x="0" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">"If the search term does not match any data or</text>
      <text x="0" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">product on the website, the 'No Records Found'</text>
      <text x="0" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">message should be displayed instead of results."</text>
    </g>

    <!-- Note Box -->
    <rect x="20" y="306" width="380" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="210" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">⚠️ Rawan salah interpretasi bila tanpa gambaran visual!</text>
  </g>

  <!-- ==================== PANEL KANAN: MOCKUP UI STATE ==================== -->
  <g transform="translate(490, 90)">
    <rect width="430" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- Title Card -->
    <rect x="20" y="16" width="390" height="30" rx="6" fill="#f0fdf4"/>
    <text x="215" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Visual Mockup Desain (Memperjelas Ekspektasi QA)</text>

    <!-- State 1: Search Sukses -->
    <g transform="translate(25, 60)">
      <rect width="380" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="85" height="18" rx="4" fill="#dbeafe"/>
      <text x="54" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Kondisi 1: Ditemukan</text>

      <!-- Search Input UI -->
      <rect x="12" y="34" width="260" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
      <text x="24" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">Buku Data Science</text>
      <rect x="280" y="34" width="88" height="28" rx="6" fill="#2563eb"/>
      <text x="324" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Cari</text>

      <!-- Result Card -->
      <g transform="translate(12, 70)">
        <rect width="356" height="28" rx="4" fill="#dcfce7" stroke="#86efac"/>
        <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#15803d">✓ Menampilkan 12 hasil produk yang relevan</text>
      </g>
    </g>

    <!-- State 2: Search Kosong -->
    <g transform="translate(25, 185)">
      <rect width="380" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="105" height="18" rx="4" fill="#fee2e2"/>
      <text x="64" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Kondisi 2: Tidak Cocok</text>

      <!-- Search Input UI -->
      <rect x="12" y="34" width="260" height="28" rx="6" fill="#ffffff" stroke="#94a3b8"/>
      <text x="24" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">XYZ-9999-Kosong</text>
      <rect x="280" y="34" width="88" height="28" rx="6" fill="#2563eb"/>
      <text x="324" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Cari</text>

      <!-- Result Error Card -->
      <g transform="translate(12, 65)">
        <rect width="356" height="34" rx="4" fill="#fef2f2" stroke="#fecaca"/>
        <text x="178" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">No Records Found</text>
        <text x="178" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#7f1d1d" text-anchor="middle">Kata kunci tidak ditemukan dalam katalog produk.</text>
      </g>
    </g>

    <!-- Success Box -->
    <rect x="20" y="306" width="390" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="215" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">✓ QA memiliki acuan uji yang konkret dan teruji!</text>
  </g>
</svg>
