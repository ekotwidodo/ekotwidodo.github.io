<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-sql" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-rdf" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="490" rx="16" fill="#f8fafc"/>

  <!-- Header Banner -->
  <g transform="translate(40, 28)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">SQL vs. SPARQL: Data Model &amp; Relationship Representation</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Relational tables with foreign key JOINs compared to RDF graphs with native edge traversals</text>
  </g>

  <!-- ==================== LEFT PANEL: RELATIONAL SQL MODEL ==================== -->
  <g transform="translate(40, 90)">
    <rect width="410" height="370" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    
    <!-- Title Card -->
    <rect x="18" y="14" width="374" height="30" rx="6" fill="#f0f9ff"/>
    <text x="205" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1" text-anchor="middle">Relational Model (Tables &amp; Foreign Key JOIN)</text>

    <!-- Table 1: books -->
    <g transform="translate(18, 54)">
      <rect width="374" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="374" height="24" rx="6" fill="#f8fafc"/>
      <rect y="18" width="374" height="6" fill="#f8fafc"/>
      <line x1="0" y1="24" x2="374" y2="24" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">TABLE: books</text>

      <!-- Columns header -->
      <line x1="110" y1="24" x2="110" y2="72" stroke="#f1f5f9"/>
      <line x1="185" y1="24" x2="185" y2="72" stroke="#f1f5f9"/>
      
      <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">author_id (FK)</text>
      <text x="120" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">book_id</text>
      <text x="195" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">title</text>

      <line x1="0" y1="46" x2="374" y2="46" stroke="#f1f5f9"/>

      <!-- Row Data -->
      <rect x="12" y="50" width="76" height="18" rx="4" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="50" y="63" font-family="monospace" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">person1</text>
      
      <text x="120" y="63" font-family="monospace" font-size="9.5" fill="#334155">book1</text>
      <text x="195" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#334155">Understanding Knowledge Graphs</text>
    </g>

    <!-- Clean Vertical JOIN Connector between matching keys -->
    <!-- Line 1: From bottom of books.author_id to top of JOIN badge -->
    <line x1="68" y1="126" x2="68" y2="148" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- JOIN ON Badge: Perfectly centered between tables -->
    <rect x="18" y="148" width="100" height="22" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="68" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">JOIN ON (FK = PK)</text>

    <!-- Line 2: From bottom of JOIN badge to authors.author_id with arrow -->
    <line x1="68" y1="170" x2="68" y2="216" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-sql)"/>

    <!-- Table 2: authors -->
    <g transform="translate(18, 222)">
      <rect width="374" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="374" height="24" rx="6" fill="#f8fafc"/>
      <rect y="18" width="374" height="6" fill="#f8fafc"/>
      <line x1="0" y1="24" x2="374" y2="24" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">TABLE: authors</text>

      <!-- Columns header -->
      <line x1="110" y1="24" x2="110" y2="72" stroke="#f1f5f9"/>
      
      <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">author_id (PK)</text>
      <text x="120" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">name</text>

      <line x1="0" y1="46" x2="374" y2="46" stroke="#f1f5f9"/>

      <!-- Row Data -->
      <rect x="12" y="50" width="76" height="18" rx="4" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="50" y="63" font-family="monospace" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">person1</text>
      
      <text x="120" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#334155">Alya Pratama</text>
    </g>

    <!-- Footer Note (English) -->
    <rect x="18" y="316" width="374" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="205" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Relationships are not stored directly; they must be computed</text>
    <text x="205" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">at query execution time through costly multi-table row JOINs</text>
  </g>

  <!-- ==================== RIGHT PANEL: RDF / SPARQL GRAPH MODEL ==================== -->
  <g transform="translate(470, 90)">
    <rect width="410" height="370" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    
    <!-- Title Card -->
    <rect x="18" y="14" width="374" height="30" rx="6" fill="#f0fdf4"/>
    <text x="205" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">RDF &amp; SPARQL Model (Native Directed Graph Pattern)</text>

    <!-- Node 1: ex:book1 (All text safely enclosed in card) -->
    <g transform="translate(25, 54)">
      <rect width="130" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="65" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">ex:book1</text>
      <rect x="20" y="28" width="90" height="16" rx="4" fill="#ffffff" stroke="#93c5fd"/>
      <text x="65" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8" text-anchor="middle">schema:Book</text>
    </g>

    <!-- Literal 1: Title (All text safely enclosed in card) -->
    <g transform="translate(235, 54)">
      <rect width="155" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="77" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="middle">Literal (xsd:string)</text>
      <text x="77" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1e293b" text-anchor="middle">"Understanding..."</text>
    </g>

    <!-- Edge Horizontal 1: ex:book1 to Title (Badge floats above line, no collision) -->
    <rect x="162" y="60" width="66" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="195" y="73" font-family="monospace" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">schema:name</text>
    <line x1="155" y1="80" x2="227" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-rdf)"/>

    <!-- Vertical Relationship: schema:author -->
    <!-- Line 1: From ex:book1 to top of schema:author badge -->
    <line x1="90" y1="106" x2="90" y2="128" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Predicate Badge: schema:author -->
    <rect x="42" y="128" width="96" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="90" y="143" font-family="monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">schema:author</text>

    <!-- Line 2: From bottom of badge to ex:person1 with arrow -->
    <line x1="90" y1="150" x2="90" y2="166" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-rdf)"/>

    <!-- Node 2: ex:person1 (All text safely enclosed in card) -->
    <g transform="translate(25, 172)">
      <rect width="130" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="65" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">ex:person1</text>
      <rect x="18" y="28" width="94" height="16" rx="4" fill="#ffffff" stroke="#86efac"/>
      <text x="65" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">schema:Person</text>
    </g>

    <!-- Literal 2: Name (All text safely enclosed in card) -->
    <g transform="translate(235, 172)">
      <rect width="155" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="77" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" text-anchor="middle">Literal (xsd:string)</text>
      <text x="77" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">"Alya Pratama"</text>
    </g>

    <!-- Edge Horizontal 2: ex:person1 to Name (Badge floats above line, no collision) -->
    <rect x="162" y="178" width="66" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="195" y="191" font-family="monospace" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">schema:name</text>
    <line x1="155" y1="198" x2="227" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-rdf)"/>

    <!-- Shared Variable Callout Badge (English) -->
    <g transform="translate(18, 246)">
      <rect width="374" height="48" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="187" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">SPARQL Graph Pattern Matching via Shared Variable:</text>
      <text x="187" y="36" font-family="monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">?book schema:author ?author . ?author schema:name ?name</text>
    </g>

    <!-- Footer Note (English) -->
    <rect x="18" y="316" width="374" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="205" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Relationships are first-class directed edges traversed</text>
    <text x="205" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">natively in memory without complex table schema joins</text>
  </g>
</svg>
