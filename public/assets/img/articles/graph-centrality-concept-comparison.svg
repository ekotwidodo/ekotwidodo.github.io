<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-bridge" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="510" rx="16" fill="#f8fafc"/>

  <!-- Top Title -->
  <g transform="translate(40, 28)">
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Analisis Centrality: Siapa Node yang Paling Berpengaruh?</text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Jaringan 7 node dengan dua kelompok terpisah yang dihubungkan oleh node D sebagai jembatan</text>
  </g>

  <!-- ==================== PANEL KIRI: VISUALISASI JARINGAN ==================== -->
  <g transform="translate(40, 90)">
    <rect width="530" height="385" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Group Labels (Background pill) -->
    <rect x="25" y="16" width="180" height="28" rx="6" fill="#eff6ff"/>
    <text x="115" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Kelompok 1 (A–B–C)</text>

    <rect x="325" y="16" width="180" height="28" rx="6" fill="#fdf2f8"/>
    <text x="415" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#be185d" text-anchor="middle">Kelompok 2 (E–F–G)</text>

    <!-- Edges: Group 1 -->
    <!-- A(75, 110) - B(175, 110) -->
    <line x1="75" y1="110" x2="175" y2="110" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- A(75, 110) - C(125, 230) -->
    <line x1="75" y1="110" x2="125" y2="230" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- B(175, 110) - C(125, 230) -->
    <line x1="175" y1="110" x2="125" y2="230" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Bridge Edges (Highlighted with Amber) -->
    <!-- C(125, 230) - D(265, 230) -->
    <line x1="125" y1="230" x2="265" y2="230" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- D(265, 230) - E(405, 230) -->
    <line x1="265" y1="230" x2="405" y2="230" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Edges: Group 2 -->
    <!-- E(405, 230) - F(355, 110) -->
    <line x1="405" y1="230" x2="355" y2="110" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- E(405, 230) - G(455, 110) -->
    <line x1="405" y1="230" x2="455" y2="110" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- F(355, 110) - G(455, 110) -->
    <line x1="355" y1="110" x2="455" y2="110" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Bridge Label Tag -->
    <rect x="225" y="165" width="80" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="265" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Jalur Jembatan</text>

    <!-- Node A -->
    <g transform="translate(75, 110)" filter="url(#node-shadow)">
      <circle cx="0" cy="0" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">A</text>
    </g>

    <!-- Node B -->
    <g transform="translate(175, 110)" filter="url(#node-shadow)">
      <circle cx="0" cy="0" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">B</text>
    </g>

    <!-- Node C (High Degree Hub) -->
    <g transform="translate(125, 230)" filter="url(#node-shadow)">
      <circle cx="0" cy="0" r="26" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">C</text>
      <!-- Degree badge -->
      <rect x="12" y="-28" width="70" height="19" rx="4" fill="#1e40af"/>
      <text x="47" y="-15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Derajat = 3</text>
    </g>

    <!-- Node D (Bridge Star: High Betweenness & Closeness) -->
    <g transform="translate(265, 230)" filter="url(#glow-bridge)">
      <circle cx="0" cy="0" r="28" fill="#fef08a" stroke="#d97706" stroke-width="3.5"/>
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#78350f" text-anchor="middle">D</text>
      <!-- Bridge badge -->
      <rect x="-42" y="36" width="84" height="20" rx="10" fill="#b45309"/>
      <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">⭐ Jembatan</text>
    </g>

    <!-- Node E (High Degree Hub) -->
    <g transform="translate(405, 230)" filter="url(#node-shadow)">
      <circle cx="0" cy="0" r="26" fill="#fbcfe8" stroke="#be185d" stroke-width="3"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#831843" text-anchor="middle">E</text>
      <!-- Degree badge -->
      <rect x="-82" y="-28" width="70" height="19" rx="4" fill="#be185d"/>
      <text x="-47" y="-15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Derajat = 3</text>
    </g>

    <!-- Node F -->
    <g transform="translate(355, 110)" filter="url(#node-shadow)">
      <circle cx="0" cy="0" r="22" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#9d174d" text-anchor="middle">F</text>
    </g>

    <!-- Node G -->
    <g transform="translate(455, 110)" filter="url(#node-shadow)">
      <circle cx="0" cy="0" r="22" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#9d174d" text-anchor="middle">G</text>
    </g>

    <!-- Bottom note in panel -->
    <text x="265" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">7 Node, 8 Edge. Node D hanya punya 2 tetangga, tetapi sangat strategis.</text>
  </g>

  <!-- ==================== PANEL KANAN: KARTU METRIK KOMPARATIF ==================== -->
  <g transform="translate(590, 90)">
    <!-- Kartu 1: Degree Centrality -->
    <g transform="translate(0, 0)">
      <rect width="330" height="115" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="14" y="12" width="120" height="24" rx="4" fill="#eff6ff"/>
      <text x="74" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Degree Centrality</text>
      <text x="14" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Pemenang: Node C &amp; E (Derajat = 3)</text>
      <text x="14" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Memiliki hubungan langsung paling banyak.</text>
      <text x="14" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Skor Normalisasi: 3 / (7 - 1) = 0,5</text>
    </g>

    <!-- Kartu 2: Betweenness Centrality -->
    <g transform="translate(0, 130)">
      <rect width="330" height="115" rx="10" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="14" y="12" width="150" height="24" rx="4" fill="#fef3c7"/>
      <text x="89" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">2. Betweenness Centrality</text>
      <text x="14" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">Pemenang: Node D (Paling Tinggi)</text>
      <text x="14" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Menjadi jembatan mutlak antar 9 pasang lintas grup.</text>
      <text x="14" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Jika D hilang, kedua kelompok terputus total.</text>
    </g>

    <!-- Kartu 3: Closeness Centrality -->
    <g transform="translate(0, 260)">
      <rect width="330" height="115" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
      <rect x="14" y="12" width="140" height="24" rx="4" fill="#f0fdf4"/>
      <text x="84" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">3. Closeness Centrality</text>
      <text x="14" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Pemenang: Node D (Skor = 0,6)</text>
      <text x="14" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Total jarak terpendek ke seluruh node = 10 langkah.</text>
      <text x="14" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Lebih dekat secara rata-rata dibanding C (skor 0,545).</text>
    </g>
  </g>
</svg>
