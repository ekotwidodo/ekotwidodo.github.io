<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Light Canvas Background -->
    <linearGradient id="bgLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="cardTopLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="cardAuthorLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <linearGradient id="cardPublisherLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>

    <linearGradient id="cardDateLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowTeal2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0d9488" />
    </marker>
    <marker id="arrowPurple2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect x="0" y="0" width="940" height="440" rx="16" fill="url(#bgLight2)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g>
    <text x="470" y="38" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Connecting Triples into an Interlinked RDF Graph</text>
    <text x="470" y="58" text-anchor="middle" fill="#64748b" font-size="12">Combining distinct statements sharing the subject: ex:book1</text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP ROOT SUBJECT NODE: ex:book1 -->
  <!-- ========================================================================= -->
  <g transform="translate(300, 85)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="340" height="84" rx="12" fill="url(#cardTopLight)" stroke="#0284c7" stroke-width="1.8" />
    <rect x="16" y="14" width="85" height="18" rx="5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="58" y="27" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="600" font-family="ui-monospace, monospace">schema:Book</text>
    <text x="16" y="52" fill="#0f172a" font-size="15" font-weight="700">Understanding Knowledge Graphs</text>
    <text x="16" y="70" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">Subject IRI: ex:book1</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3 DIRECTED CONNECTORS (LEFT, CENTER, RIGHT) -->
  <!-- ========================================================================= -->
  <!-- Connector Left (Author) -->
  <path d="M 400 169 C 400 230, 180 220, 180 270" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrowTeal2)" />
  <g transform="translate(200, 205)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="120" height="26" rx="6" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.2" />
    <text x="60" y="17" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="600" font-family="ui-monospace, monospace">schema:author</text>
  </g>

  <!-- Connector Center (Publisher) -->
  <line x1="470" y1="169" x2="470" y2="270" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrowPurple2)" />
  <g transform="translate(400, 205)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.2" />
    <text x="70" y="17" text-anchor="middle" fill="#6b21a8" font-size="11" font-weight="600" font-family="ui-monospace, monospace">schema:publisher</text>
  </g>

  <!-- Connector Right (Date Published) -->
  <path d="M 540 169 C 540 230, 760 220, 760 270" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen2)" />
  <g transform="translate(670, 205)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2" />
    <text x="80" y="17" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600" font-family="ui-monospace, monospace">schema:datePublished</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3 TARGET OBJECT NODES -->
  <!-- ========================================================================= -->
  <!-- Object 1: Author (Resource) -->
  <g transform="translate(45, 275)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="270" height="84" rx="12" fill="url(#cardAuthorLight)" stroke="#0d9488" stroke-width="1.8" />
    <rect x="14" y="14" width="95" height="18" rx="5" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1" />
    <text x="61" y="27" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="600" font-family="ui-monospace, monospace">schema:Person</text>
    <text x="14" y="52" fill="#0f172a" font-size="15" font-weight="700">Alya Pratama</text>
    <text x="14" y="70" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">Resource IRI: ex:person1</text>
  </g>

  <!-- Object 2: Publisher (Resource) -->
  <g transform="translate(335, 275)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="270" height="84" rx="12" fill="url(#cardPublisherLight)" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="14" y="14" width="130" height="18" rx="5" fill="#f3e8ff" stroke="#c084fc" stroke-width="1" />
    <text x="79" y="27" text-anchor="middle" fill="#7e22ce" font-size="10" font-weight="600" font-family="ui-monospace, monospace">schema:Organization</text>
    <text x="14" y="52" fill="#0f172a" font-size="15" font-weight="700">Example Press</text>
    <text x="14" y="70" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">Resource IRI: ex:publisher1</text>
  </g>

  <!-- Object 3: Date (Typed Literal) -->
  <g transform="translate(625, 275)" filter="url(#softShadow2)">
    <rect x="0" y="0" width="270" height="84" rx="12" fill="url(#cardDateLight)" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2" />
    <rect x="14" y="14" width="80" height="18" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="54" y="27" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600" font-family="ui-monospace, monospace">xsd:date</text>
    <text x="14" y="52" fill="#0f172a" font-size="15" font-weight="700" font-family="ui-monospace, monospace">"2024-04-12"</text>
    <text x="14" y="70" fill="#15803d" font-size="11">Literal Value (Typed)</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(240, 395)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="24" y="13" fill="#475569" font-size="12">Resource Node (with IRI)</text>

    <rect x="230" y="0" width="16" height="16" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="254" y="13" fill="#475569" font-size="12">Literal Node (Datatyped)</text>
  </g>
</svg>
