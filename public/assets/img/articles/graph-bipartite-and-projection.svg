<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="490" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="918" height="488" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Banner -->
  <g transform="translate(40, 32)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Bipartite Graph &amp; Konsep Projected Graph</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Menghubungkan dua entitas berbeda (Mahasiswa &amp; Mata Kuliah), lalu memproyeksikan relasi homogen</text>
  </g>

  <!-- ==================== PANEL KIRI: BIPARTITE GRAPH ==================== -->
  <g transform="translate(40, 100)">
    <rect width="420" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Title Card -->
    <rect x="20" y="16" width="380" height="34" rx="8" fill="#f0f9ff"/>
    <text x="210" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">A. Bipartite Graph (Dua Himpunan Entitas Berbeda)</text>

    <!-- Sub-headers Kolom -->
    <rect x="25" y="62" width="135" height="24" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="92" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Himpunan Mahasiswa</text>

    <rect x="250" y="62" width="145" height="24" rx="6" fill="#fef3c7" stroke="#fde68a"/>
    <text x="322" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Himpunan Mata Kuliah</text>

    <!-- ================= EDGES BIPARTITE ================= -->
    <!-- Rina (x=140, y=122) -> Basis Data (x=245, y=142) -->
    <line x1="140" y1="122" x2="245" y2="142" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rina (x=140, y=122) -> Machine Learning (x=245, y=227) -->
    <line x1="140" y1="122" x2="245" y2="227" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Dodi (x=140, y=185) -> Basis Data (x=245, y=142) -->
    <line x1="140" y1="185" x2="245" y2="142" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sari (x=140, y=248) -> Machine Learning (x=245, y=227) -->
    <line x1="140" y1="248" x2="245" y2="227" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ================= NODES MAHASISWA (KIRI) ================= -->
    <!-- Node Rina -->
    <g transform="translate(35, 105)">
      <rect width="105" height="34" rx="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="20" cy="17" r="7" fill="#2563eb"/>
      <text x="60" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Rina</text>
    </g>

    <!-- Node Dodi -->
    <g transform="translate(35, 168)">
      <rect width="105" height="34" rx="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="20" cy="17" r="7" fill="#2563eb"/>
      <text x="60" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Dodi</text>
    </g>

    <!-- Node Sari -->
    <g transform="translate(35, 231)">
      <rect width="105" height="34" rx="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="20" cy="17" r="7" fill="#2563eb"/>
      <text x="60" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Sari</text>
    </g>

    <!-- ================= NODES MATA KULIAH (KANAN) ================= -->
    <!-- Node Basis Data: Jarak bulet ke teks lapang dan proporsional -->
    <g transform="translate(245, 124)">
      <rect width="155" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="18" cy="18" r="6" fill="#d97706"/>
      <text x="34" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="start">Basis Data</text>
    </g>

    <!-- Node Machine Learning: Jarak bulet ke teks lapang dan proporsional -->
    <g transform="translate(245, 209)">
      <rect width="155" height="36" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="18" cy="18" r="6" fill="#7c3aed"/>
      <text x="34" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="start">Machine Learning</text>
    </g>

    <!-- Catatan Kaki Kartu -->
    <rect x="20" y="302" width="380" height="28" rx="6" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="210" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Edge hanya menghubungkan Mahasiswa ↔ Mata Kuliah</text>
  </g>

  <!-- ==================== ARROW TRANSISI ==================== -->
  <g transform="translate(468, 245)">
    <circle cx="17" cy="15" r="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <path d="M 10 15 L 24 15 M 19 10 L 25 15 L 19 20" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="17" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4f46e5" text-anchor="middle">Proyeksi</text>
  </g>

  <!-- ==================== PANEL KANAN: PROJECTED GRAPH ==================== -->
  <g transform="translate(510, 100)">
    <rect width="370" height="350" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Title Card -->
    <rect x="20" y="16" width="330" height="34" rx="8" fill="#fdf4ff"/>
    <text x="185" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a21caf" text-anchor="middle">B. Projected Graph (Proyeksi Mahasiswa)</text>

    <!-- Subtitle Info -->
    <text x="185" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Relasi langsung jika mengambil minimal 1 MK yang sama</text>

    <!-- ================= EDGES & BADGES ================= -->
    <!-- 1. Hubungan Horizontal: Rina ke Dodi -->
    <!-- Kotak label "Basis Data" diposisikan dekat di atas garis (y=108..128, garis di y=135, jarak 7px) -->
    <rect x="140" y="108" width="80" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="180" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Basis Data</text>

    <!-- Garis horizontal dari tepi luar Rina (112) ke Dodi (248) -->
    <line x1="112" y1="135" x2="248" y2="135" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

    <!-- 2. Hubungan Vertikal: Rina ke Sari -->
    <!-- Garis vertikal di x=90 -->
    <line x1="90" y1="157" x2="90" y2="223" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>

    <!-- Kotak label "Machine Learning" diposisikan dekat di samping kanan garis (x=98, jarak 8px) -->
    <rect x="98" y="180" width="105" height="20" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="150" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Machine Learning</text>

    <!-- Keterangan hubungan Dodi & Sari di area kanan bawah -->
    <rect x="210" y="210" width="125" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="272" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Dodi ↮ Sari</text>
    <text x="272" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">(Tidak ada MK bersama)</text>

    <!-- ================= NODES DALAM PROYEKSI ================= -->
    <!-- Node Rina (cx=90, cy=135, r=22) -->
    <circle cx="90" cy="135" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="90" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">Rina</text>

    <!-- Node Dodi (cx=270, cy=135, r=22) -->
    <circle cx="270" cy="135" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="270" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">Dodi</text>

    <!-- Node Sari (cx=90, cy=245, r=22) -->
    <circle cx="90" cy="245" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="90" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">Sari</text>

    <!-- Catatan Kaki Kartu -->
    <rect x="20" y="302" width="330" height="28" rx="6" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="185" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Relasi terbentuk berdasarkan kesamaan kelas yang diikuti</text>
  </g>
</svg>
