<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <filter id="card-drop-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Light Canvas Background -->
  <rect width="1020" height="540" rx="16" fill="#f8fafc"/>

  <!-- Top Banner Box -->
  <g transform="translate(30, 20)">
    <rect width="960" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-drop-shadow)"/>
    <text x="30" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Choosing the Right LLM Strategy: RAG vs. Fine-Tuning vs. Long Context Window</text>
    <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Comparing trade-offs across cost, data freshness, traceability, and operational complexity</text>
  </g>

  <!-- ==================== THREE COLUMN CARDS ==================== -->

  <!-- COLUMN 1: RAG (Retrieval-Augmented Generation) -->
  <g transform="translate(30, 96)">
    <rect width="305" height="420" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#card-drop-shadow)"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="273" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="152" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">Retrieval-Augmented Gen (RAG)</text>
    <text x="152" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">Dynamic External Knowledge Injection</text>

    <!-- Dimension 1: Knowledge Freshness -->
    <g transform="translate(16, 68)">
      <rect width="273" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#dcfce7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Freshness</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">Real-time / Instant</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">Update vector DB anytime without model retraining</text>
    </g>

    <!-- Dimension 2: Hallucination & Source Attribution -->
    <g transform="translate(16, 128)">
      <rect width="273" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#dcfce7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Grounding</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">Very High (Citable)</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">Provides precise citations &amp; verifiable source chunks</text>
    </g>

    <!-- Dimension 3: Computational & Financial Cost -->
    <g transform="translate(16, 188)">
      <rect width="273" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#dbeafe"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Cost</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">Low to Moderate</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af">Standard vector search compute; off-the-shelf LLMs</text>
    </g>

    <!-- Dimension 4: Access Control & Data Governance -->
    <g transform="translate(16, 248)">
      <rect width="273" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#dbeafe"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Governance</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">Granular &amp; Strict</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af">User RBAC can filter search queries dynamically</text>
    </g>

    <!-- Best For Box -->
    <g transform="translate(16, 312)">
      <rect width="273" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="8" y="8" width="100" height="20" rx="4" fill="#e2e8f0"/>
      <text x="58" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Best Suited For:</text>
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Dynamic enterprise knowledge bases</text>
      <text x="12" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Auditable customer support &amp; research</text>
      <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Constantly changing regulations &amp; products</text>
    </g>
  </g>

  <!-- COLUMN 2: FINE-TUNING -->
  <g transform="translate(357, 96)">
    <rect width="305" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-drop-shadow)"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="273" height="38" rx="8" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="152" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#86198f" text-anchor="middle">Fine-Tuning (Model Training)</text>
    <text x="152" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#a21caf" text-anchor="middle">Parametric Weight Modification</text>

    <!-- Dimension 1: Knowledge Freshness -->
    <g transform="translate(16, 68)">
      <rect width="273" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#fee2e2"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Freshness</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">Static / Periodic</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#991b1b">Requires curated training pipeline &amp; compute runs</text>
    </g>

    <!-- Dimension 2: Hallucination & Source Attribution -->
    <g transform="translate(16, 128)">
      <rect width="273" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#fef3c7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Grounding</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">Implicit / Black-Box</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">Cannot cite source paragraphs; still prone to bias</text>
    </g>

    <!-- Dimension 3: Computational & Financial Cost -->
    <g transform="translate(16, 188)">
      <rect width="273" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#fee2e2"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">Cost</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">High to Very High</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#991b1b">GPU training clusters, dedicated endpoint hosting</text>
    </g>

    <!-- Dimension 4: Access Control & Data Governance -->
    <g transform="translate(16, 248)">
      <rect width="273" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#fef3c7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Governance</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">All-or-Nothing</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">Learned knowledge baked directly into weights</text>
    </g>

    <!-- Best For Box -->
    <g transform="translate(16, 312)">
      <rect width="273" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="8" y="8" width="100" height="20" rx="4" fill="#e2e8f0"/>
      <text x="58" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Best Suited For:</text>
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Learning specific syntax, JSON schemas</text>
      <text x="12" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Custom tone, brand persona, style guides</text>
      <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Highly specialized domain vocabulary</text>
    </g>
  </g>

  <!-- COLUMN 3: LONG CONTEXT WINDOW (LCW) -->
  <g transform="translate(685, 96)">
    <rect width="305" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-drop-shadow)"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="273" height="38" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="152" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#6b21a8" text-anchor="middle">Long Context Windows (LCW)</text>
    <text x="152" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9333ea" text-anchor="middle">Massive Prompt Ingestion (1M+ Tokens)</text>

    <!-- Dimension 1: Knowledge Freshness -->
    <g transform="translate(16, 68)">
      <rect width="273" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#dcfce7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">Freshness</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">Immediate (In-Prompt)</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">Pass whole files directly into the active prompt</text>
    </g>

    <!-- Dimension 2: Hallucination & Source Attribution -->
    <g transform="translate(16, 128)">
      <rect width="273" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#fef3c7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Grounding</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">Moderate to High</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">Can suffer "Lost in the Middle" attention degradation</text>
    </g>

    <!-- Dimension 3: Computational & Financial Cost -->
    <g transform="translate(16, 188)">
      <rect width="273" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#fef3c7"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Cost</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">Scales with Tokens</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">Expensive at scale per query without prompt caching</text>
    </g>

    <!-- Dimension 4: Access Control & Data Governance -->
    <g transform="translate(16, 248)">
      <rect width="273" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="8" y="8" width="80" height="18" rx="4" fill="#dbeafe"/>
      <text x="48" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Governance</text>
      <text x="96" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">Session-Bounded</text>
      <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af">Controlled by what caller attaches per request</text>
    </g>

    <!-- Best For Box -->
    <g transform="translate(16, 312)">
      <rect width="273" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="8" y="8" width="100" height="20" rx="4" fill="#e2e8f0"/>
      <text x="58" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Best Suited For:</text>
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Ad-hoc code repository analysis</text>
      <text x="12" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Analyzing single long books or legal contracts</text>
      <text x="12" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">• Full transcript summarization</text>
    </g>
  </g>
</svg>
