<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <filter id="triad-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="560" rx="16" fill="#f8fafc"/>

  <!-- Top Title Box -->
  <g transform="translate(40, 20)">
    <rect width="880" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#triad-shadow)"/>
    <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a">The RAG Triad: Evaluating Quality and Hallucinations</text>
    <text x="24" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">A holistic measurement framework for Context Relevance, Groundedness, and Answer Relevance</text>
  </g>

  <!-- ==================== TRIAD INTERACTION DIAGRAM ==================== -->
  <g transform="translate(40, 94)">
    <rect width="880" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#triad-shadow)"/>

    <!-- Connecting Arrows / Paths -->
    <!-- Query -> Retrieved Chunks (Left diagonal) -->
    <path d="M 380 72 L 200 160" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
    
    <!-- Query -> Generated Answer (Right diagonal) -->
    <path d="M 500 72 L 680 160" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
    
    <!-- Generated Answer -> Retrieved Chunks (Bottom horizontal feedback) -->
    <path d="M 570 205 L 310 205" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

    <!-- TOP NODE: User Query -->
    <g transform="translate(320, 20)">
      <rect width="240" height="64" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
      <rect x="12" y="8" width="216" height="22" rx="4" fill="#dbeafe"/>
      <text x="120" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">1. User Query / Prompt</text>
      <text x="120" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">Input question or task request</text>
    </g>

    <!-- METRIC BADGE 1: Context Relevance (Left Diagonal) -->
    <g transform="translate(140, 88)">
      <rect width="180" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="90" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">Context Relevance</text>
      <text x="90" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="middle">Are chunks relevant to query?</text>
    </g>

    <!-- METRIC BADGE 2: Answer Relevance (Right Diagonal) -->
    <g transform="translate(560, 88)">
      <rect width="180" height="42" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
      <text x="90" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="middle">Answer Relevance</text>
      <text x="90" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#9333ea" text-anchor="middle">Does answer solve user's query?</text>
    </g>

    <!-- BOTTOM-LEFT NODE: Retrieved Chunks -->
    <g transform="translate(50, 165)">
      <rect width="250" height="80" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
      <rect x="12" y="10" width="226" height="24" rx="4" fill="#dbeafe"/>
      <text x="125" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">2. Retrieved Context Chunks</text>
      <text x="125" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">Top-k passages from Vector DB</text>
      <text x="125" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">(Sparse + Dense hybrid matches)</text>
    </g>

    <!-- METRIC BADGE 3: Groundedness / Faithfulness (Center Bottom) -->
    <g transform="translate(350, 185)">
      <rect width="180" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="90" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#15803d" text-anchor="middle">Groundedness (Faithfulness)</text>
      <text x="90" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#16a34a" text-anchor="middle">Zero hallucination check</text>
    </g>

    <!-- BOTTOM-RIGHT NODE: Generated Answer -->
    <g transform="translate(580, 165)">
      <rect width="250" height="80" rx="10" fill="#f8fafc" stroke="#9333ea" stroke-width="2"/>
      <rect x="12" y="10" width="226" height="24" rx="4" fill="#f3e8ff"/>
      <text x="125" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#6b21a8" text-anchor="middle">3. Generated LLM Answer</text>
      <text x="125" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">Final response synthesized by LLM</text>
      <text x="125" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">(Accompanied by inline citations)</text>
    </g>

    <!-- Subtle Footer Note Card -->
    <rect x="50" y="264" width="780" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="440" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">RAG Triad protects against: Hallucinations (Groundedness) • Irrelevant Retrieval (Context) • Evasive Responses (Answer)</text>
  </g>

  <!-- ==================== THREE EXPLANATORY CARDS ==================== -->
  <g transform="translate(40, 418)">
    <!-- Card 1: Context Relevance -->
    <g transform="translate(0, 0)">
      <rect width="280" height="122" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#triad-shadow)"/>
      <rect x="12" y="10" width="256" height="26" rx="5" fill="#eff6ff"/>
      <text x="140" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Context Relevance</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Does context contain noise?</text>
      <text x="16" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Measures whether retrieved chunks</text>
      <text x="16" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">are strictly relevant to user query</text>
      <text x="16" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">without extraneous distractors.</text>
    </g>

    <!-- Card 2: Groundedness -->
    <g transform="translate(300, 0)">
      <rect width="280" height="122" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#triad-shadow)"/>
      <rect x="12" y="10" width="256" height="26" rx="5" fill="#f0fdf4"/>
      <text x="140" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#15803d" text-anchor="middle">Groundedness (Faithfulness)</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Is the answer mathematically factual?</text>
      <text x="16" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Ensures claims can be deduced</text>
      <text x="16" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">directly from context, eliminating</text>
      <text x="16" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">unsubstantiated hallucinations.</text>
    </g>

    <!-- Card 3: Answer Relevance -->
    <g transform="translate(600, 0)">
      <rect width="280" height="122" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#triad-shadow)"/>
      <rect x="12" y="10" width="256" height="26" rx="5" fill="#faf5ff"/>
      <text x="140" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#7e22ce" text-anchor="middle">Answer Relevance</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Did the bot address the query?</text>
      <text x="16" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Evaluates whether the final text</text>
      <text x="16" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">directly addresses the prompt rather</text>
      <text x="16" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">than deflecting with generic replies.</text>
    </g>
  </g>
</svg>
