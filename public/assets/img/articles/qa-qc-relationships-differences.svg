<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="490" rx="16" fill="#f8fafc"/>

  <!-- Header Title -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Hierarki Sistem Mutu &amp; Perbandingan QA vs QC</text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Hubungan relasional antara Quality System, QA, QC, dan Testing beserta perbedaan utamanya</text>
  </g>

  <!-- ==================== PANEL KIRI: HIERARKI KOTAK BERTINGKAT ==================== -->
  <g transform="translate(40, 80)">
    <rect width="420" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#panel-shadow)"/>
    
    <!-- Title Card -->
    <rect x="20" y="14" width="380" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="210" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Hierarki Sistem Penjaminan Mutu (Quality System)</text>

    <!-- BOX 1: Quality Management System (Paling Luar) -->
    <g transform="translate(20, 56)">
      <rect width="380" height="300" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <!-- Label Box 1 -->
      <rect x="15" y="10" width="350" height="26" rx="5" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="190" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">1. Quality Management System (QMS)</text>

      <!-- BOX 2: Quality Assurance (QA) -->
      <g transform="translate(15, 46)">
        <rect width="350" height="230" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <!-- Label Box 2 -->
        <rect x="15" y="10" width="320" height="28" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="175" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">2. Quality Assurance (QA) — Process</text>

        <!-- BOX 3: Quality Control (QC) -->
        <g transform="translate(15, 48)">
          <rect width="320" height="160" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
          <!-- Label Box 3 -->
          <rect x="15" y="10" width="290" height="28" rx="5" fill="#fde68a" stroke="#fcd34d"/>
          <text x="160" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">3. Quality Control (QC) — Product</text>

          <!-- BOX 4: Software Testing (Inti di Tengah) -->
          <g transform="translate(15, 48)">
            <rect width="290" height="90" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
            <!-- Label Box 4 -->
            <rect x="12" y="10" width="266" height="26" rx="4" fill="#fed7aa" stroke="#fb923c"/>
            <text x="145" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#9a3412" text-anchor="middle">4. Software Testing (Execution)</text>
            
            <!-- Deskripsi Box 4 -->
            <rect x="12" y="44" width="266" height="34" rx="4" fill="#fff7ed"/>
            <text x="145" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7c2d12" text-anchor="middle">Eksekusi skenario uji untuk menemukan defect</text>
            <text x="145" y="71" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#9a3412" text-anchor="middle">serta memverifikasi fungsi aplikasi</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== PANEL KANAN: TABEL KOMPARASI KOTAK QA VS QC ==================== -->
  <g transform="translate(485, 80)">
    <rect width="435" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#panel-shadow)"/>

    <!-- Comparison Header Boxes -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="194" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="97" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">Quality Assurance (QA)</text>

      <rect x="204" y="0" width="194" height="32" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="301" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">Quality Control (QC)</text>
    </g>

    <!-- Row 1: Orientasi -->
    <g transform="translate(18, 56)">
      <rect x="0" y="0" width="194" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="97" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">Process-Oriented</text>
      <text x="97" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Fokus pada alur pembuatan produk</text>

      <rect x="204" y="0" width="194" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="301" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Product-Oriented</text>
      <text x="301" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Fokus pada pengujian produk akhir</text>
    </g>

    <!-- Row 2: Sifat Tindakan -->
    <g transform="translate(18, 118)">
      <rect x="0" y="0" width="194" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="97" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">Preventive (Pencegahan)</text>
      <text x="97" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#15803d" text-anchor="middle">Mencegah terjadinya cacat sejak dini</text>

      <rect x="204" y="0" width="194" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="301" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Corrective (Deteksi)</text>
      <text x="301" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="middle">Mendeteksi cacat yang sudah muncul</text>
    </g>

    <!-- Row 3: Siklus Eksekusi -->
    <g transform="translate(18, 180)">
      <rect x="0" y="0" width="194" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="97" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Sepanjang Siklus SDLC</text>
      <text x="97" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Mulai dari requirement sampai rilis</text>

      <rect x="204" y="0" width="194" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="301" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Fase Pengujian (STLC)</text>
      <text x="301" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Dijalankan saat modul selesai di-build</text>
    </g>

    <!-- Row 4: Mindset Utama -->
    <g transform="translate(18, 242)">
      <rect x="0" y="0" width="194" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="97" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">Bangun Mutu ke Dalamnya</text>
      <text x="97" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Cara yang benar menghasilkan mutu</text>

      <rect x="204" y="0" width="194" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="301" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Uji Kesesuaian Standar</text>
      <text x="301" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Validasi hasil sesuai kriteria rilis</text>
    </g>

    <!-- Bottom Distinction Card -->
    <g transform="translate(18, 306)">
      <rect x="0" y="0" width="398" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
      <rect x="10" y="8" width="378" height="20" rx="4" fill="#e2e8f0"/>
      <text x="199" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#1e293b" text-anchor="middle">Defect vs Bug: Perbedaan Berdasarkan Lingkungan Ditemukan</text>
      <text x="199" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Ditemukan di fase testing = Defect | Lolos ke production = Bug</text>
    </g>
  </g>
</svg>
