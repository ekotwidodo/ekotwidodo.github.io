    meta_description: "About Eko Teguh Widodo's personal IT portal, focus areas in Artificial Intelligence, publishing commitment, and professional background."
    hero:
      avatar: "https://avatars.githubusercontent.com/u/90574398?v=4"
      badges:
        - text: "Personal IT Portal"
          variant: "primary"
        - text: "Daily Tech Commitment"
          variant: "teal"
        - text: "AI & Engineering"
          variant: "indigo"
      heading: "Information & Technology Exploration Portal"
      description: "Welcome to the personal web portal of {name}. This platform serves as an independent space to share insights, in-depth analyses, and practical engineering solutions centered around Artificial Intelligence and modern Software Systems."
      commitment:
        enabled: true
        title: "Daily Publishing Commitment"
        description: "Articles on this portal are dedicated to frequent publication to provide up-to-date reading material relevant to industry needs and academic research, establishing a helpful knowledge base for developers, researchers, and technology enthusiasts."
    domains_section:
      title: "Core Focus & Technology Domains"
      subtitle: "Structured hierarchically from engineering foundations to advanced specializations (GNN & GeoAI)."
      hierarchy_note: "Hierarchy: General → Specialized"
      topics_label: "Key Topics:"
      items:
        - id: "software-engineering"
          title: "Software & Requirement Engineering"
          badge: "Foundation"
          variant: "purple"
          level: "General • Foundation"
          description: "Designing clean and modular software architectures (Clean Architecture), applying software design patterns, formal requirement elicitation and specification (Requirement Engineering), and managing the software engineering lifecycle (SDLC)."
          topics:
            - "Clean Architecture"
            - "Software Design Patterns"
            - "Requirement Elicitation & Specs"
            - "Modular Systems"
            - "Clean Code Principles"
        - id: "quality-assurance"
          title: "Quality Assurance & Automated Testing"
          badge: "QA & Testing"
          variant: "amber"
          level: "General • Verification"
          description: "Comprehensive software quality assurance strategies covering automated API testing (RestAssured), UI test automation, continuous testing in CI/CD pipelines, regression testing, and production-grade reliability validation."
          topics:
            - "API Automation Testing"
            - "UI / End-to-End Testing"
            - "Continuous Testing in CI/CD"
            - "Regression & Performance Testing"
            - "Test Frameworks"
        - id: "data-engineering"
          title: "Data Engineering & Data Analysis"
          badge: "Data Stack"
          variant: "emerald"
          level: "Intermediate • Data"
          description: "Designing distributed large-scale data pipelines (ETL / ELT), data warehousing, dimensional data modeling, data governance, and exploratory statistical data analysis to support data-driven decision-making."
          topics:
            - "ETL / ELT Data Pipelines"
            - "Data Modeling & Warehousing"
            - "Data Governance"
            - "Exploratory Data Analysis (EDA)"
            - "Statistical Analytics"
        - id: "ai-ml"
          title: "Artificial Intelligence & Machine Learning"
          badge: "AI & ML"
          variant: "primary"
          level: "Advanced • Core AI"
          description: "Developing Machine Learning models, Deep Learning, Large Language Models (LLM), transformer architectures, and AI Engineering for predictive, analytical, and generative intelligent systems."
          topics:
            - "Deep Learning"
            - "LLMs & Foundation Models"
            - "Neural Networks"
            - "MLOps"
            - "Supervised & Unsupervised Learning"
        - id: "nlp"
          title: "Natural Language Processing (NLP) & Text Analytics"
          badge: "NLP"
          variant: "rose"
          level: "Specialized • Language Domain"
          description: "Advanced natural language processing and understanding, Named Entity Recognition (NER), text classification, semantic modeling, and textual corpus engineering for intelligent inference."
          topics:
            - "Named Entity Recognition (NER)"
            - "Text Embeddings"
            - "Sentiment Analysis"
            - "Information Extraction"
            - "Corpus Engineering"
        - id: "knowledge-graphs"
          title: "Knowledge Graphs & Semantic Web"
          badge: "Semantics"
          variant: "indigo"
          level: "Specialized • Semantic Graphs"
          description: "Formal structured knowledge representation, domain ontology modeling, W3C Semantic Web standards (RDF, RDFS, OWL, SPARQL), Virtual Knowledge Graphs (Ontop OBDA), and knowledge graph synergy with LLMs (GraphRAG)."
          topics:
            - "Ontology Engineering"
            - "Linked Open Data (LOD)"
            - "SPARQL"
            - "Ontop OBDA"
            - "GraphRAG"
        - id: "gnn"
          title: "Graph Representation Learning & GNN (Graph Neural Networks)"
          badge: "GNN & Graph ML"
          variant: "purple"
          level: "Specialized • Graph Learning"
          description: "Representation learning on non-Euclidean graph structures, Graph Neural Network architectures (GCN, GAT, GraphSAGE), node and edge embeddings, link prediction, and deep graph inference."
          topics:
            - "Graph Neural Networks (GNN)"
            - "Node & Edge Embeddings"
            - "Graph Convolutional Networks (GCN)"
            - "Graph Attention Networks (GAT)"
            - "GraphSAGE"
            - "Link Prediction"
        - id: "geo-ai"
          title: "GeoAI (Geospatial Artificial Intelligence)"
          badge: "GeoAI"
          variant: "teal"
          level: "Specialized • Geospatial & GIS"
          description: "Convergence of Artificial Intelligence with Geographic Information Systems (GIS), Remote Sensing, satellite imagery analysis, and Spatial Knowledge Graphs for spatial object detection and geospatial intelligence."
          topics:
            - "Spatial Deep Learning"
            - "Satellite Imagery Analysis"
            - "Remote Sensing"
            - "GIS & Spatial Analytics"
            - "Spatial Knowledge Graphs"
